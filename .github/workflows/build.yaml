name: Build and Release Executables

on:
  push:
    branches:
      - game_only
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Configuration
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-6

      - name: Install dependancies Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
        shell: bash

      - name: Compilation PyInstaller
        run: |
          pyinstaller game_compile.spec

      - name: Archive
        run: |
          python -c "import shutil; shutil.make_archive('Draw_A_Bridge-${{ runner.os }}', 'zip', 'dist/Draw_A_Bridge')"

      - name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          path: Draw_A_Bridge-${{ runner.os }}.zip
          archive: False

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Draw_A_Bridge-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Draw_A_Bridge-Linux.zip
            Draw_A_Bridge-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
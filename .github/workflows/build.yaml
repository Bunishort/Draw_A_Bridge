name: Build and Release Executables

on:
  push:
    branches:
      - game_only
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-6

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame PyOpenGL imgui[pygame]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Compilation avec PyInstaller
        run: |
          pyinstaller game_compile.spec

      - name: Compression en archive ZIP
        run: |
          python -c "import shutil; shutil.make_archive('Draw_A_Bridge-${{ runner.os }}', 'zip', 'dist/Draw_A_Bridge')"

      - name: Sauvegarde de l'artéfact
        uses: actions/upload-artifact@v4
        with:
          name: Draw_A_Bridge-${{ runner.os }}
          path: Draw_A_Bridge-${{ runner.os }}.zip

  release:
    name: Créer la Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger tous les artéfacts
        uses: actions/download-artifact@v4
        with:
          pattern: Draw_A_Bridge-*
          merge-multiple: true

      - name: Créer la Release et publier les ZIPs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Draw_A_Bridge-Linux.zip
            Draw_A_Bridge-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Executables

on:
  push:
    branches:
      - game_only

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-6

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame PyOpenGL imgui[pygame]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Compilation avec PyInstaller
        run: |
          pyinstaller game_compile.spec

      - name: Sauvegarde des artéfacts
        uses: actions/upload-artifact@v4
        with:
          name: Draw_A_Bridge-${{ runner.os }}
          path: dist/Draw_A_Bridge/